name: Deploy App & Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Unpack & Test
        run: |
          if [ -f authenticator-pro-v3-app.zip ] && [ ! -f index.html ]; then
            unzip -o authenticator-pro-v3-app.zip -d _tmp
            cp -r _tmp/authenticator-pro/. .
            sed -i 's|/authenticator-pro/|/Authenticator-Pro/|g' manifest.webmanifest
          fi
          node tests/test.mjs
      - uses: actions/configure-pages@v5
      - name: Assemble site
        run: |
          mkdir -p _site
          cp -r index.html manifest.webmanifest sw.js css js icons _site/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy-pages:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  build-apk:
    needs: deploy-pages
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Build Native Android APK (No URL Bar, Real Standalone App)
        run: |
          mkdir -p android/app/src/main/assets
          cp -r index.html manifest.webmanifest sw.js css js icons android/app/src/main/assets/
          keytool -genkeypair -v -keystore android.keystore -alias authpro \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass authpro123 -keypass authpro123 \
            -dname "CN=Authenticator Pro, OU=App, O=Safi, L=Rajshahi, ST=Rajshahi, C=BD"
          cd android
          gradle wrapper --gradle-version 8.11.1
          chmod +x gradlew
          ./gradlew assembleRelease
          mkdir -p ../apk-out
          cp app/build/outputs/apk/release/app-release.apk ../apk-out/Authenticator-Pro-v3.0.0.apk
          ls -la ../apk-out
      - uses: actions/upload-artifact@v4
        with:
          name: Authenticator-Pro-v3.0.0-APK
          path: apk-out/*.apk
