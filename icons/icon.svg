<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <!-- Background Gradient (Ultra-Deep Obsidian Sapphire) -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050b1a"/>
      <stop offset="50%" stop-color="#0a152e"/>
      <stop offset="100%" stop-color="#02050c"/>
    </linearGradient>

    <!-- Shield Outer Armor Gradient -->
    <linearGradient id="shieldArmorGrad" x1="15%" y1="0%" x2="85%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="25%" stop-color="#2563eb"/>
      <stop offset="70%" stop-color="#1d2456"/>
      <stop offset="100%" stop-color="#090d1f"/>
    </linearGradient>

    <!-- Shield Facet Light Bevel -->
    <linearGradient id="facetLight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.8"/>
      <stop offset="40%" stop-color="#a5f3fc" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0"/>
    </linearGradient>

    <!-- Metallic Gold Shackle Gradient -->
    <linearGradient id="goldShackle" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="45%" stop-color="#fbbf24"/>
      <stop offset="80%" stop-color="#d97706"/>
      <stop offset="100%" stop-color="#92400e"/>
    </linearGradient>

    <!-- Pure Quantum Core Glow -->
    <linearGradient id="quantumCore" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="50%" stop-color="#a5f3fc"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>

    <!-- Ambient Shadow & Glow Filters -->
    <filter id="cyberGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="14" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <filter id="coreFlare" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="8" result="flare"/>
      <feComposite in="SourceGraphic" in2="flare" operator="over"/>
    </filter>
  </defs>

  <!-- App Icon Squircle Container -->
  <rect width="512" height="512" rx="118" fill="url(#bgGrad)"/>
  
  <!-- Subtle Outer Glass Rim -->
  <rect width="504" height="504" x="4" y="4" rx="114" fill="none" stroke="rgba(56,189,248,0.25)" stroke-width="2.5"/>

  <!-- Background Cyber Aura Sphere -->
  <circle cx="256" cy="245" r="150" fill="url(#facetLight)" opacity="0.08" filter="url(#cyberGlow)"/>

  <!-- Master Shield Emblem Group -->
  <g id="shieldEmblem">
    <!-- Drop Shadow for the entire shield -->
    <path d="M256 50 L420 115 C420 295 256 422 256 450 C256 422 92 295 92 115 Z"
          fill="rgba(0,0,0,0.65)" filter="url(#cyberGlow)"/>

    <!-- Outer Aerodynamic Cyber Shield Body -->
    <path d="M256 46 L420 112 C420 292 256 420 256 448 C256 420 92 292 92 112 Z"
          fill="url(#shieldArmorGrad)" stroke="rgba(255,255,255,0.7)" stroke-width="4"/>

    <!-- Left Facet Highlight (3D Chamfer) -->
    <path d="M256 50 L96 114 C96 290 256 418 256 444 Z"
          fill="url(#facetLight)" opacity="0.35"/>

    <!-- Inner Optical Floating Frame -->
    <path d="M256 74 L396 130 C396 276 256 384 256 410 C256 384 116 276 116 130 Z"
          fill="none" stroke="rgba(255,255,255,0.22)" stroke-width="2" stroke-dasharray="8 4"/>

    <!-- Concentric Cyber Security Radar Rings -->
    <circle cx="256" cy="240" r="102" fill="none" stroke="rgba(56,189,248,0.3)" stroke-width="1.5"/>
    <circle cx="256" cy="240" r="82" fill="rgba(6,16,38,0.7)" stroke="rgba(56,189,248,0.4)" stroke-width="2"/>

    <!-- Water-Drop Specular Highlight Lens on Dome -->
    <path d="M200 175 C230 162 282 162 312 175 C295 186 217 186 200 175 Z"
          fill="#ffffff" opacity="0.4" filter="url(#coreFlare)"/>

    <!-- Golden Cyber-Lock Shackle -->
    <path d="M216 230 L216 182 C216 160 234 142 256 142 C278 142 296 160 296 182 L296 230"
          fill="none" stroke="url(#goldShackle)" stroke-width="18" stroke-linecap="round"/>

    <!-- Inner Shackle Shadow Depth -->
    <path d="M222 225 L222 184 C222 165 237 150 256 150 C275 150 290 165 290 184 L290 225"
          fill="none" stroke="rgba(0,0,0,0.35)" stroke-width="6" stroke-linecap="round"/>

    <!-- Vault Padlock Main Body (Pure Metallic Glass Armor) -->
    <rect x="188" y="215" width="136" height="106" rx="26"
          fill="url(#quantumCore)" filter="url(#coreFlare)"/>
    
    <!-- Lock Body Inner Bevel Ring -->
    <rect x="194" y="221" width="124" height="94" rx="20"
          fill="none" stroke="rgba(255,255,255,0.8)" stroke-width="2"/>

    <!-- Quantum Keyhole & Biometric Optics -->
    <circle cx="256" cy="256" r="12" fill="#060c1d"/>
    <path d="M250 262 L262 262 L266 288 C266 293 261 297 256 297 C251 297 246 293 246 288 Z"
          fill="#060c1d"/>

    <!-- Keyhole Inner Radiant Cyan Spark -->
    <circle cx="256" cy="256" r="5" fill="#38bdf8"/>
    <circle cx="256" cy="256" r="2" fill="#ffffff"/>

    <!-- Symmetrical 2FA Energy Rays (Left and Right Accent Wings) -->
    <g stroke="url(#quantumCore)" stroke-width="3" stroke-linecap="round" opacity="0.85">
      <!-- Left side verification ticks -->
      <line x1="148" y1="230" x2="168" y2="230"/>
      <line x1="140" y1="245" x2="168" y2="245"/>
      <line x1="148" y1="260" x2="168" y2="260"/>
      <!-- Right side verification ticks -->
      <line x1="344" y1="230" x2="364" y2="230"/>
      <line x1="344" y1="245" x2="372" y2="245"/>
      <line x1="344" y1="260" x2="364" y2="260"/>
    </g>

    <!-- Bottom Shield Apex Diamond Spark -->
    <polygon points="256,368 261,378 256,388 251,378" fill="#38bdf8" opacity="0.9"/>
  </g>
</svg>
