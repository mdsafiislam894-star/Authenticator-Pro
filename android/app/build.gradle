plugins {
    id 'com.android.application'
}

android {
    namespace 'tech.mdsafiislam.authenticatorpro'
    compileSdk 34

    defaultConfig {
        applicationId "tech.mdsafiislam.authenticatorpro"
        minSdk 24
        targetSdk 34
        versionCode 3
        versionName "3.0.0"
    }

    signingConfigs {
        release {
            def ksPass = System.getenv("KS_PASS") ?: System.getenv("KEYSTORE_PASS") ?: "ci-ephemeral-key"
            storeFile file("${rootDir}/../android.keystore")
            storePassword ksPass
            keyAlias "authpro"
            keyPassword ksPass
            v1SigningEnabled true
            v2SigningEnabled true
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'androidx.core:core:1.13.1'
    implementation 'androidx.webkit:webkit:1.12.0'
    implementation 'com.google.android.material:material:1.12.0'
}
